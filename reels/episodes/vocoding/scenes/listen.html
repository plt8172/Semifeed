<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../../kit/kit.css">
<style>.tile{position:absolute;left:0;right:0;height:250px;border-radius:36px;background:var(--dim);display:flex;align-items:center;padding:0 36px;gap:30px}
.tile .k{font-size:130px;font-weight:900;width:110px}.tile .d{font-size:40px;font-weight:800;line-height:1.3}.tile .d small{display:block;font-size:32px;color:var(--muted);font-weight:700}
.tile svg{position:absolute;right:30px;top:35px}</style>
<div id="stage"><div class="safe">
  <div id="head" class="h2" style="position:absolute;top:10px;width:100%">받는 폰이 다시 만든다</div>
  <div id="intro" style="position:absolute;top:190px;width:100%">
    <svg width="870" height="560" viewBox="0 0 870 560">
      <rect x="285" y="20" width="300" height="520" rx="48" fill="none" stroke="var(--fg)" stroke-width="7"/>
      <g id="chips"><circle r="26" fill="var(--b)"/><circle r="26" fill="var(--a)"/><circle r="26" fill="var(--c)"/></g>
      <path id="out" fill="none" stroke="var(--a)" stroke-width="5"/>
    </svg>
  </div>
  <div id="tiles">
    <div class="tile" id="tA" style="top:200px"><span class="k" style="color:var(--a)">A</span><span class="d">원래 그대로<small>1초에 64,000칸</small></span><svg width="300" height="180"><path fill="none" stroke="var(--a)" stroke-width="5"/></svg></div>
    <div class="tile" id="tB" style="top:490px"><span class="k" style="color:var(--b)">B</span><span class="d">2G 폰 방식<small>1초에 13,000칸</small></span><svg width="300" height="180"><path fill="none" stroke="var(--b)" stroke-width="5"/></svg></div>
    <div class="tile" id="tC" style="top:780px"><span class="k" style="color:var(--c)">C</span><span class="d">극한 보코더<small>1초에 700칸</small></span><svg width="300" height="180"><path fill="none" stroke="var(--c)" stroke-width="5"/></svg></div>
  </div>
</div></div>
<script src="../../../kit/kit.js"></script>
<script>
const clips = ["audio/A.wav", "audio/B.wav", "audio/C.wav"], ids = ["#tA", "#tB", "#tC"];
const starts = [0.5, 2.4, 4.3].map(x => Reel.data.scene.vo_start + Reel.data.scene.vo_duration + x);
Reel.scene((t, R) => {
  R.set("#head", { o: R.ramp(t, 0, .3) });
  const end = R.at(1), introO = 1 - R.ramp(t, end, end + .3);
  Reel.$("#intro").style.opacity = introO;
  Reel.$("#tiles").style.opacity = R.ramp(t, end, end + .3);
  [...Reel.$("#chips").children].forEach((c, i) => { const f = R.ramp(t, R.at(.1 + i * .08), R.at(.35 + i * .08));
    c.setAttribute("cx", R.lerp(120 + i * 315, 435, f)); c.setAttribute("cy", R.lerp(520, 120, f)); c.setAttribute("opacity", f < 1 ? 1 : 0); });
  const g = R.ramp(t, R.at(.45), R.at(.9)), s = R.clip("audio/A.wav").slice(1200, 2600);
  Reel.$("#out").setAttribute("d", R.wavePath(s.slice(0, Math.max(2, Math.floor(s.length * g))), 315, 315 + 240 * g, 300, 170, 200));
  clips.forEach((c, i) => {
    const el = Reel.$(ids[i]), a = starts[i], s = R.clip(c), dur = s.length / 4000;
    const live = t >= a - .15 && t < a + dur + .2, done = t >= a + dur + .2;
    el.style.background = live ? "#ffffff22" : "var(--dim)";
    el.style.opacity = t < a - .2 ? .35 : 1;
    R.set(el, { o: el.style.opacity, s: live ? 1.04 + 0.04 * R.level(t) : 1 });
    const k = live ? R.clamp((t - a) / dur) : done ? 1 : 0;
    el.querySelector("path").setAttribute("d", R.wavePath(s.slice(0, Math.max(2, Math.floor(s.length * k))), 0, 300 * Math.max(k, .01), 90, 80, 160));
  });
});
</script>
