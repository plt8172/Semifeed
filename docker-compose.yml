services:
  n8n:
    image: n8nio/n8n:2.39.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - path: ./config/n8n.env
        required: true
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Create .env and set N8N_ENCRYPTION_KEY}
    volumes:
      - ~/.n8n:/home/node/.n8n
      - ./data/instagram:/data/instagram
      - ./config:/data/config:ro
      - ./n8n:/data/workflows:ro
    depends_on:
      - browserless

  browserless:
    image: browserless/chrome
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=1
