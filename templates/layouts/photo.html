<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semifeed card: photo</title>
  <style>
    /* 사진 한 장 + 그라데이션. 장식 요소 없이 사진이 분위기를, 글자가 내용을 맡는다.
       4:5 세로(1080×1350). 사진은 가로 원본(1280×853)이라 카드 전체에 깔면 1.6배 확대돼 흐려진다.
       그래서 사진은 위쪽 900px에 원본에 가까운 크기로 두고, 아래로 갈수록 배경색에 녹여 본문 영역을 만든다.
       프로필 그리드는 3:4로 좌우를 34px씩 자르므로, 글자는 좌우 여백(--pad) 안쪽에만 둔다. */
    @font-face {
      font-family: Pretendard;
      src: url("../../fonts/PretendardVariable.woff2") format("woff2-variations");
      font-weight: 45 920;
      font-display: block;
    }

    :root {
      --canvas: #0b0f14;
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.86);
      --text-muted: rgba(255, 255, 255, 0.62);
      --pad: 72px;
      --photo-h: 900px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #02070b;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--text);
      /* 사진이 없을 때 보이는 배경 (DESIGN.md: Empty image) */
      background: linear-gradient(160deg, #1d2b38 0%, var(--canvas) 70%);
    }

    .photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--photo-h);
      object-fit: cover;
    }

    /* 위쪽은 메타 정보가 읽힐 만큼만 어둡게 하고, 사진 아래쪽은 배경색으로 녹여 사진 경계가 보이지 않게 한다. */
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.5) 0px,
        rgba(0, 0, 0, 0) 240px,
        rgba(0, 0, 0, 0) 420px,
        rgba(11, 15, 20, 0.8) 740px,
        var(--canvas) var(--photo-h),
        var(--canvas) 100%
      );
    }

    .topbar {
      position: absolute;
      top: 60px;
      left: var(--pad);
      right: var(--pad);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 700;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
    }

    .brand {
      letter-spacing: 0.16em;
    }

    .meta {
      display: flex;
      gap: 14px;
      color: var(--text-soft);
      font-weight: 600;
    }

    .meta .dot {
      color: var(--text-muted);
    }

    .story {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 64px;
      max-height: 700px;
      overflow: hidden;
    }

    h1 {
      max-height: 164px;
      margin: 0 0 30px;
      overflow: hidden;
      font-size: 64px;
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .bullets {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullets li {
      position: relative;
      padding-left: 24px;
      color: var(--text-soft);
      font-size: 26px;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .bullets li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 0.66em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .footer {
      margin-top: 36px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 500;
    }

    .footer strong {
      color: var(--text-soft);
      font-weight: 700;
    }

    @media (max-width: 1080px) {
      .card {
        transform: scale(calc(100vw / 1080));
        transform-origin: top left;
      }

      body {
        display: block;
        width: 100vw;
        height: calc(100vw * 1350 / 1080);
        min-height: 0;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <article class="card" aria-label="Semifeed 반도체 뉴스 카드">
    <img class="photo" data-field="image" src="" alt="" hidden>
    <div class="shade"></div>

    <header class="topbar">
      <span class="brand">SEMIFEED</span>
      <span class="meta">
        <span data-field="category">산업</span>
        <span class="dot">·</span>
        <time data-field="published-at">2026.09.20</time>
      </span>
    </header>

    <main class="story">
      <h1 data-field="headline">차세대 반도체 투자가 공급망의 무게중심을 바꾼다</h1>
      <ul class="bullets" data-field="bullets">
        <li>첨단 공정과 패키징을 중심으로 주요 기업의 설비 투자가 확대되고 있습니다.</li>
        <li>공급망 안정성과 지역별 생산 역량이 새로운 경쟁 기준으로 떠올랐습니다.</li>
        <li>단기 수요보다 장기 기술 로드맵과 실제 양산 일정에 주목할 필요가 있습니다.</li>
      </ul>
      <footer class="footer">
        <span>출처 · <strong data-field="source">Sample News</strong></span>
        <span data-field="image-credit"></span>
      </footer>
    </main>
  </article>
</body>
</html>
